<!DOCTYPE html>

<html lang="de" class="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WetterPilot Pro - Präzisionswetter & Unwetterradar</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#070b13">

<!-- OneSignal Web Push SDK -->

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>

function updatePushButtonUI(isSubscribed) {

const btn = document.getElementById("pushSyncBtn");

const text = document.getElementById("pushSyncBtnText");

if (!btn || !text) return;

if (isSubscribed) {

text.textContent = "Push-Benachrichtigungen aktiv ✓";

btn.className = "w-full bg-slate-800/80 hover:bg-slate-800 transition-all text-emerald-400 font-medium py-3 px-4 rounded-2xl border border-emerald-500/30 text-xs md:text-sm cursor-pointer flex items-center justify-center gap-2 shadow-inner";

} else {

text.textContent = "Push-Nachrichten für Unwetter aktivieren";

btn.className = "w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.99] transition-all text-white font-semibold py-3 px-4 rounded-2xl shadow-lg border border-emerald-400/30 text-xs md:text-sm cursor-pointer flex items-center justify-center gap-2";

}

}

function syncGpsToOneSignal(lat, lon) {

if (!window.OneSignalDeferred) return;

window.OneSignalDeferred.push(async function(OneSignal) {

try {

const subId = OneSignal.User?.PushSubscription?.id || null;

if (OneSignal.User && OneSignal.User.addTags) {

await OneSignal.User.addTags({

user_lat: parseFloat(lat).toFixed(2),

user_lon: parseFloat(lon).toFixed(2)

});

console.log("GPS an OneSignal übertragen:", parseFloat(lat).toFixed(2), parseFloat(lon).toFixed(2));

}

fetch('https://little-lab-0f3a.venus-markus.workers.dev/alert', {

method: 'POST',

headers: { 'Content-Type': 'application/json' },

body: JSON.stringify({

lat: parseFloat(lat),

lon: parseFloat(lon),

subscription_id: subId

})

}).then(res => res.json())

.then(data => console.log("Standort-Warnprüfung (Einzelgerät):", data))

.catch(err => console.warn("Alert-Check fehlgeschlagen:", err));

} catch (e) {

console.warn("Fehler beim GPS-Sync:", e);

}

});

}

window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {

await OneSignal.init({

appId: "0bfeab4b-de0e-4382-b17f-4baa4cc39356",

serviceWorkerPath: "OneSignalSDKWorker.js",

serviceWorkerParam: { scope: "/wetterpilot/" }

});

const isOptedIn = OneSignal.User?.PushSubscription?.optedIn || false;

updatePushButtonUI(isOptedIn);

if (OneSignal.User?.PushSubscription?.addEventListener) {

OneSignal.User.PushSubscription.addEventListener("change", function(event) {

const active = event.current?.optedIn || false;

updatePushButtonUI(active);

if (!stationEl) return;

try {

const res = await fetch(`https://api.brightsky.dev/current_weather?lat=${lat}&lon=${lon}`);

const data = await res.json();

if (data.sources && data.sources.length > 0) {

const src = data.sources[0];

const distKm = (src.distance / 1000).toFixed(1);

let stationName = src.station_name || "DWD Station";

if (stationName === "München-Stadt" || src.id === "03379" || src.station_id === "03379") {

stationName = "München-Stadt (Helene-Weber-Allee)";

}

stationEl.textContent = `${stationName} • ${distKm} km entfernt`;

} else {

stationEl.textContent = "München-Stadt (Helene-Weber-Allee)";

}

} catch (err) {

stationEl.textContent = "München-Stadt (Helene-Weber-Allee)";

}

}

function updateWindDisplay(cur) {

const speed = Math.round(cur.wind_speed_10m || 0);

const gust = Math.round(cur.wind_gusts_10m || speed);

const direction = cur.wind_direction_10m || 0;

const directions = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];

const dirText = directions[Math.round(direction / 45) % 8];

let bft = 0;

if (gust >= 118) bft = 12;

else if (gust >= 103) bft = 11;

else if (gust >= 89) bft = 10;

else if (gust >= 75) bft = 9;

else if (gust >= 62) bft = 8;

else if (gust >= 50) bft = 7;

else if (gust >= 39) bft = 6;

else if (gust >= 29) bft = 5;

else if (gust >= 20) bft = 4;

else if (gust >= 12) bft = 3;

else if (gust >= 6) bft = 2;

else if (gust >= 1) bft = 1;

const card = document.getElementById("wind-card");

const title = document.getElementById("wind-title");

const speedVal = document.getElementById("wind-speed-val");

const gustVal = document.getElementById("wind-gust-val");

const status = document.getElementById("wind-status");

if (!card || !speedVal || !gustVal || !status) return;

speedVal.textContent = `${speed} km/h (${dirText})`;

gustVal.textContent = `Spitzenböen: ${gust} km/h (Bft ${bft})`;

if (gust >= 90) {

card.className = "glass-panel rounded-2xl p-4 shadow-md flex flex-col justify-between border-l-4 border-l-rose-500 hover:border-slate-700 transition duration-300";

title.textContent = "🚨 Sturm-Alarm (Stufe 3)";

status.textContent = "Gefahr durch schwere Sturmböen! Äste brechen.";

status.className = "text-[11px] font-semibold text-rose-400 mt-2 truncate";

} else if (gust >= 65) {

card.className = "glass-panel rounded-2xl p-4 shadow-md flex flex-col justify-between border-l-4 border-l-orange-500 hover:border-slate-700 transition duration-300";

title.textContent = "⚠️ Sturmböen (Stufe 2)";

status.textContent = "Markantes Wetter – Windfeste Sicherung nötig.";

status.className = "text-[11px] font-semibold text-orange-400 mt-2 truncate";

} else if (gust >= 50) {

card.className = "glass-panel rounded-2xl p-4 shadow-md flex flex-col justify-between border-l-4 border-l-amber-500 hover:border-slate-700 transition duration-300";

title.textContent = "⚠️ Windböen (Stufe 1)";

status.textContent = "Achtung: Frischer bis starker Wind mit Böen.";

status.className = "text-[11px] font-semibold text-amber-400 mt-2 truncate";

} else {

card.className = "glass-panel rounded-2xl p-4 shadow-md flex flex-col justify-between border-l-4 border-l-emerald-500 hover:border-slate-700 transition duration-300";

title.textContent = "Wind & Böen";

status.textContent = "Lage ruhig – keine Windgefahren.";

status.className = "text-[11px] font-semibold text-emerald-400 mt-2 truncate";

}

}

async function loadBiowetter(lat, lon) {

const container = document.getElementById('biowetterContainer');

if (!container) return;

try {

const dwdUrl = 'https://opendata.dwd.de/climate_environment/health/alerts/biowetter.json';

const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(dwdUrl)}`;

const res = await fetch(proxyUrl);

if (!res.ok) throw new Error("Netzwerkfehler");

const json = await res.json();

let regions = [];

if (json.sender && Array.isArray(json.sender)) {

regions = json.sender;

} else if (Array.isArray(json)) {

regions = json;

} else if (json.city && Array.isArray(json.city)) {

regions = json.city;

}

const region = regions.find(r => 

(r.name && (r.name.includes("Oberbayern") || r.name.includes("Schwaben") || r.name.includes("München"))) ||

(r.value && (r.value.toLowerCase().includes("k0") || r.value.toLowerCase() === "k"))

) || regions[0];


renderWeatherData(data, false);

await loadRadarTicker(lat, lon, data.current.weather_code);

} catch (err) {

const cachedRaw = localStorage.getItem(`wetter_cache_${lat.toFixed(2)}_${lon.toFixed(2)}_${selectedModel}`);

if (cachedRaw) {

try {

const cachedObj = JSON.parse(cachedRaw);

renderWeatherData(cachedObj.data, true, cachedObj.time);

await loadRadarTicker(lat, lon, cachedObj.data.current.weather_code);

showNotification(`Störung beim Wetterdienst. Zeige Daten von ${cachedObj.time}`, "info");

return;

} catch(e) {}

}

await loadRadarTicker(lat, lon, null);

document.getElementById('weatherDesc').textContent = "Störung beim Wetterdienst (Open-Meteo)";

showNotification("Störung beim Wetterdienst (Open-Meteo). Bitte später erneut versuchen.", "error");

}

}

async function searchCity() {

const q = document.getElementById('cityInput').value.trim();

if (!q) {

showNotification("Bitte gib einen Städtenamen ein.", "error");

return;

}

try {

const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=de`);

const data = await res.json();

if (data.results && data.results.length > 0) {

const place = data.results[0];

const displayName = place.admin1 ? `${place.name}, ${place.admin1}` : place.name;

loadWeather(place.latitude, place.longitude, displayName);

document.getElementById('cityInput').value = "";

showNotification(`Wetter für "${displayName}" geladen!`);

} else {

showNotification(`Ort "${q}" nicht gefunden.`, "error");

}

} catch (e) {

showNotification("Verbindungsfehler bei der Ortssuche.", "error");

}

}

function loadQuickCity(lat, lon, name) {

loadWeather(lat, lon, name);

showNotification(`Ort ausgewählt: ${name}`);

}

async function getLocation() {

if (!navigator.geolocation) {

showNotification("Standortbestimmung wird vom Browser nicht unterstützt.", "error");

return;

}

showNotification("Standort wird ermittelt...");

navigator.geolocation.getCurrentPosition(

async (pos) => {

const lat = pos.coords.latitude;

const lon = pos.coords.longitude;

loadWeather(lat, lon, "Mein Standort 📍");

syncGpsToOneSignal(lat, lon);

try {

const geoRes = await fetch(

`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&zoom=13&format=json&addressdetails=1&accept-language=de`

);

const geoData = await geoRes.json();

const addr = geoData.address || {};

const hauptStadt = addr.city || addr.town || addr.municipality || addr.village || "";

let bezirk = addr.city_district || addr.borough || addr.suburb || "";

if (bezirk.toLowerCase() === "friedenheim" || bezirk.toLowerCase() === "st. ulrich") {

bezirk = "Laim";

}

if (bezirk.toLowerCase().includes("moosach")) {

bezirk = "Moosach";

}

let detectedName = "Mein Standort 📍";

if (bezirk && hauptStadt && bezirk.toLowerCase() !== hauptStadt.toLowerCase()) {

detectedName = `${bezirk} (${hauptStadt})`;

} else if (hauptStadt) {

detectedName = hauptStadt;

} else if (addr.county) {

detectedName = addr.county;

}

loadWeather(lat, lon, detectedName);

showNotification(`Standort erkannt: ${detectedName}!`);

} catch (e) {

showNotification("Standort geladen!");

}

},

() => {

showNotification("Standortzugriff verweigert oder Signal fehlt.", "error");

},

{ timeout: 10000, enableHighAccuracy: true }

);

}

setInterval(() => {

loadWeather(currentLat, currentLon, currentName, true);

}, 10 * 60 * 1000);

updateActiveModelBadge();

if (navigator.geolocation) {

getLocation();

} else {

loadWeather(currentLat, currentLon, currentName);

}

</script>

</body>

</html>
