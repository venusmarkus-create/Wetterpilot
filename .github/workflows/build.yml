name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Manifest and Keystore
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.markusvenus.wetterpilot",
            "host": "venusmarkus-create.github.io",
            "name": "Wetterpilot",
            "launcherName": "Wetterpilot",
            "themeColor": "#0284c7",
            "navigationColor": "#000000",
            "backgroundColor": "#ffffff",
            "enableNotifications": true,
            "startUrl": "/Wetterpilot/",
            "iconUrl": "https://venusmarkus-create.github.io/Wetterpilot/icon-512.png",
            "maskableIconUrl": "https://venusmarkus-create.github.io/Wetterpilot/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://venusmarkus-create.github.io/Wetterpilot/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            }
          }
          EOF
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass pass1234 -keypass pass1234 -dname "CN=Markus, OU=App, O=Wetterpilot, L=Munich, S=Bavaria, C=DE"

      - name: Configure Bubblewrap CLI
        run: |
          mkdir -p ~/.bubblewrap
          cat << 'EOF' > ~/.bubblewrap/config.json
          {
            "jdkPath": "${{ env.JAVA_HOME }}",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Build Android Bundle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUBBLEWRAP_KEYSTORE_PASSWORD: pass1234
          BUBBLEWRAP_KEY_PASSWORD: pass1234
        run: |
          bubblewrap build --manifest=twa-manifest.json

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wetterpilot-AAB
          path: "*.aab"

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Signing-Keystore
          path: android.keystore
